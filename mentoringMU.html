<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>導師風格探索地圖</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        
        /* 自定義拉桿樣式 */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #1e293b;
            cursor: pointer;
            margin-top: -6px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
        
        <!-- Header Section -->
        <header class="bg-slate-900 p-8 text-white relative">
            <div class="relative z-10">
                <h1 class="text-2xl md:text-3xl font-bold flex items-center gap-3">
                    <i data-lucide="navigation" class="text-sky-400"></i>
                    導師風格探索地圖
                </h1>
                <p id="header-desc" class="text-slate-400 mt-2 text-sm max-w-xl">
                    了解自己的內在動力，找到與 mentee 共同成長的最佳路徑
                </p>
            </div>
        </header>

        <main id="app-container" class="p-6 md:p-10">
            <!-- 內容由 JavaScript 動態渲染 -->
        </main>

        <!-- Footer -->
        <footer class="bg-slate-50 border-t border-slate-100 p-8 text-center">
            <p class="text-[10px] text-slate-400 font-bold italic tracking-[0.2em] uppercase">
                — Be the light that warms others without burning out yourself —
            </p>
        </footer>
    </div>

    <script>
        // --- 設定與資料 ---
        const GOOGLE_SCRIPT_URL = ""; // 在此填入您的 GAS 部署網址

        const state = {
            employeeId: '',
            internalLoc: 50,
            prosocial: 50,
            mode: 'assessment', 
            currentStep: 0, 
            locAnswers: [0, 0, 0, 0, 0],
            proAnswers: [0, 0, 0, 0, 0],
            isSubmitting: false
        };

        const questions = {
            loc: [
                "當 mentee (導生) 成長有限時，我會先反思自己是否可以做得更好。",
                "mentee (導生) 的學習成效，部分取決於我如何引導與回饋。",
                "即使制度不完善，我仍能在 mentoring 關係中創造正向影響。",
                "我相信自己可以透過調整方式，幫助不同特質的 mentee (導生)。",
                "若 mentoring 沒有進展，我會主動嘗試新的做法。"
            ],
            pro: [
                "我願意花時間傾聽 mentee (導生) 的想法與困惑。",
                "當 mentee (導生) 感到挫折時，我會先給予情緒支持，而不只是建議。",
                "我會試著站在 mentee (導生) 的立場理解他的選擇與反應。",
                "即使 mentee (導生) 進度較慢，我仍願意耐心陪伴。",
                "我關心 mentee (導生) 是否感到被尊重與理解。"
            ]
        };

        // --- 邏輯函數 ---

        function getAnalysis(loc, pro) {
            if (loc >= 50 && pro >= 50) {
                return {
                    style: "平衡引領者",
                    color: "bg-emerald-500",
                    icon: "sparkles",
                    quote: "「當你的內在穩定，你便能照亮他人的路。」",
                    description: "你展現了極佳的平衡感：既有照顧他人的熱忱，也對指導過程充滿信心。這種特質讓你能夠在不迷失自我的前提下，給予 mentee 最具質感的支持。",
                    energyAdvice: "由於你投入程度高且具備掌控感，容易成為組織中的『導師楷模』。請注意定期進行『自我督導』，檢視是否因過度追求完美指導而忽略了自己的工作負荷，保持能量的永續性。",
                    growthTip: "你具備成為『導師教練 (Mentor Coach)』的潛力。嘗試將你的直覺反應轉化為可複製的『引導模組』，分享給其他導師，從一對一的指導提升到帶領導師社群的層次。"
                };
            } else if (loc < 50 && pro >= 50) {
                return {
                    style: "溫情陪伴者",
                    color: "bg-rose-400",
                    icon: "heart",
                    quote: "「給予溫暖的同時，也要為自己留一盞燈。」",
                    description: "你是一位極具共情能力的導師，mentee 在你身邊會感到非常安全。但有時你會過於在意對方的進度，當結果不如預期時，你容易產生無力感。",
                    energyAdvice: "請務必練習『心理切割』。提醒自己：你是支持者，而非替 mentee 承擔成敗的人。當感到疲憊時，請學會適時抽離，建立健康的情感邊界，避免『同情疲勞』。",
                    growthTip: "嘗試練習『教練式問句 (Coaching Questions)』，減少直接的情感安慰，轉而引導對方思考下一步。將焦點從『共感痛苦』移向『結構化解決方案』，這能減輕你的能量損耗。"
                };
            } else if (loc >= 50 && pro < 50) {
                return {
                    style: "效能推進者",
                    color: "bg-indigo-500",
                    icon: "anchor",
                    quote: "「精準的引導，能讓成長事半功倍。」",
                    description: "你是一位風格乾脆、實事求是的導師。深信能力與方法是成功的關鍵，能提供清晰戰略。但在建立情感信任層面，投入較為節制。",
                    energyAdvice: "你的能量保護良好，但若 mentee 成長受阻，你可能會感到急躁。請將『建立心理安全感』視為一項必要的指標，提醒自己信任才是專業建議能被採納的前提。",
                    growthTip: "嘗試『脆弱力 (Vulnerability)』分享。在互動中分享一個你曾經搞砸的例子或失敗經驗。這能降低對方的防衛心，縮短彼此心理距離，讓你的專業建議更有影響力。"
                };
            } else {
                return {
                    style: "自主隨行者",
                    color: "bg-slate-500",
                    icon: "user",
                    quote: "「在陪伴中等待，讓成長自然發生。」",
                    description: "你傾向於與 mentee 保持適當距離，給予極大自主權。這種風格能讓成熟的人有發揮空間，但也可能被誤解為不感興趣或冷淡。",
                    energyAdvice: "你目前對 Mentoring 參與度較低，或許是因為你尚未發現這項任務對你的價值。請試著從對方身上挖掘一個『你感興趣的視角』(如新世代思維)，將指導轉化為『反向學習』的機會。",
                    growthTip: "建立『微型互動機制』。不需要頻繁深談，但每週傳一個簡單訊息（如：最近有什麼挑戰？）主動發起連結。這能讓你維持導師的存在感，同時不增加過多心理負擔。"
                };
            }
        }

        async function submitData() {
            if (!GOOGLE_SCRIPT_URL) return;
            const analysis = getAnalysis(state.internalLoc, state.prosocial);
            const payload = {
                employeeId: state.employeeId,
                locScore: state.internalLoc,
                prosocialScore: state.prosocial,
                style: analysis.style,
                timestamp: new Date().toLocaleString()
            };
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) { console.error("Submit failed", e); }
        }

        // --- 渲染函數 ---

        function render() {
            const container = document.getElementById('app-container');
            const headerDesc = document.getElementById('header-desc');
            
            if (state.mode === 'assessment') {
                headerDesc.innerText = "了解自己的內在動力，找到與 mentee 共同成長的最佳路徑";
                renderAssessment(container);
            } else {
                headerDesc.innerText = `工號 ${state.employeeId} 的風格座標已完成`;
                renderResult(container);
            }
            lucide.createIcons();
        }

        function renderAssessment(container) {
            let content = `
                <div class="max-w-2xl mx-auto">
                    <div class="flex items-center justify-between mb-10 px-4">
                        <div class="flex gap-2">
                            <div class="h-2 w-12 rounded-full ${state.currentStep >= 0 ? 'bg-indigo-500' : 'bg-slate-200'}"></div>
                            <div class="h-2 w-12 rounded-full ${state.currentStep >= 1 ? 'bg-sky-500' : 'bg-slate-200'}"></div>
                            <div class="h-2 w-12 rounded-full ${state.currentStep >= 2 ? 'bg-rose-400' : 'bg-slate-200'}"></div>
                        </div>
                        <span class="text-xs font-black text-slate-300 uppercase tracking-widest text-right">Step ${state.currentStep + 1} / 3</span>
                    </div>
            `;

            if (state.currentStep === 0) {
                content += `
                    <div class="animate-in fade-in duration-500">
                        <div class="bg-indigo-50 p-8 rounded-3xl border border-indigo-100 text-center mb-8">
                            <i data-lucide="user" class="w-12 h-12 text-indigo-500 mx-auto mb-4"></i>
                            <h2 class="text-xl font-bold text-slate-800 mb-2">基本資料填寫</h2>
                            <p class="text-sm text-slate-500 italic">在開始評測前，請先輸入您的工號以紀錄您的專屬軌跡</p>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <label class="block text-sm font-bold text-slate-700 mb-3 uppercase tracking-wider">員工工號</label>
                            <input type="text" id="emp-id-input" value="${state.employeeId}" 
                                placeholder="Input Employee ID..." 
                                class="w-full px-4 py-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-xl font-mono text-center tracking-widest">
                        </div>
                    </div>
                `;
            } else {
                const isLOC = state.currentStep === 1;
                const qs = isLOC ? questions.loc : questions.pro;
                const ans = isLOC ? state.locAnswers : state.proAnswers;
                const title = isLOC ? "第一階段：引導推動力 (Internal LOC)" : "第二階段：支持熱忱 (Prosocial)";
                const icon = isLOC ? "book-open" : "heart";
                const color = isLOC ? "text-sky-600" : "text-rose-400";
                const border = isLOC ? "border-sky-500" : "border-rose-400";

                content += `
                    <div class="space-y-6">
                        <div class="flex items-center gap-3 mb-8 p-6 rounded-2xl bg-white shadow-sm border-l-4 ${border}">
                            <i data-lucide="${icon}" class="${color}"></i>
                            <div>
                                <h2 class="text-xl font-bold text-slate-800">${title}</h2>
                                <p class="text-xs text-slate-400 mt-1 font-medium italic">1 分非常不同意，5 分非常同意</p>
                            </div>
                        </div>
                        ${qs.map((q, i) => `
                            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                                <p class="text-sm font-semibold text-slate-700 mb-6">${i+1}. ${q}</p>
                                <div class="flex justify-between w-full gap-2">
                                    ${[1,2,3,4,5].map(v => `
                                        <button onclick="setAnswer(${v}, ${i})" 
                                            class="flex-1 h-10 rounded-xl text-sm font-bold transition-all border ${ans[i] === v ? 'bg-slate-900 text-white border-slate-900 shadow-md' : 'bg-white text-slate-400 border-slate-100 hover:border-slate-300'}">
                                            ${v}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            const canNext = state.currentStep === 0 ? state.employeeId.trim().length > 0 : (state.currentStep === 1 ? state.locAnswers : state.proAnswers).every(v => v > 0);

            content += `
                <div class="mt-12 flex justify-between items-center border-t border-slate-100 pt-8">
                    <button onclick="prevStep()" class="text-sm font-bold flex items-center gap-2 text-slate-400 hover:text-slate-600 ${state.currentStep === 0 ? 'invisible' : ''}">
                        返回上一步
                    </button>
                    <button id="next-step-btn" onclick="nextStep()" ${!canNext ? 'disabled' : ''} 
                        class="px-10 py-3 rounded-2xl text-sm font-bold flex items-center gap-3 transition-all shadow-lg ${canNext ? 'bg-slate-900 text-white hover:bg-slate-800 hover:-translate-y-1' : 'bg-slate-100 text-slate-300 cursor-not-allowed'}">
                        ${state.isSubmitting ? '處理中...' : (state.currentStep < 2 ? '繼續下一步' : '計算結果')}
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
                </div>
            `;
            container.innerHTML = content;

            if(state.currentStep === 0) {
                const input = document.getElementById('emp-id-input');
                input.focus();
                input.setSelectionRange(input.value.length, input.value.length);
                
                input.addEventListener('input', (e) => {
                    state.employeeId = e.target.value;
                    const nextBtn = document.getElementById('next-step-btn');
                    if (state.employeeId.trim().length > 0) {
                        nextBtn.disabled = false;
                        nextBtn.classList.remove('bg-slate-100', 'text-slate-300', 'cursor-not-allowed');
                        nextBtn.classList.add('bg-slate-900', 'text-white', 'hover:bg-slate-800', 'hover:-translate-y-1');
                    } else {
                        nextBtn.disabled = true;
                        nextBtn.classList.add('bg-slate-100', 'text-slate-300', 'cursor-not-allowed');
                        nextBtn.classList.remove('bg-slate-900', 'text-white', 'hover:bg-slate-800', 'hover:-translate-y-1');
                    }
                });
            }
        }

        function renderResult(container) {
            const data = getAnalysis(state.internalLoc, state.prosocial);
            container.innerHTML = `
                <div class="grid md:grid-cols-2 gap-12 animate-in fade-in duration-700">
                    <div class="space-y-8">
                        <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100 shadow-inner">
                            <h4 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-6">能量指標細節</h4>
                            <div class="space-y-8">
                                <section>
                                    <div class="flex justify-between items-center mb-3">
                                        <label class="text-xs font-bold text-slate-700 flex items-center gap-2"><i data-lucide="book-open" class="w-4 h-4 text-sky-600"></i> 引導推動力</label>
                                        <span class="text-xs font-mono font-bold text-sky-600">${state.internalLoc}%</span>
                                    </div>
                                    <input type="range" value="${state.internalLoc}" oninput="updateLoc(this.value)" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-slate-800">
                                </section>
                                <section>
                                    <div class="flex justify-between items-center mb-3">
                                        <label class="text-xs font-bold text-slate-700 flex items-center gap-2"><i data-lucide="heart" class="w-4 h-4 text-rose-500"></i> 支持熱忱</label>
                                        <span class="text-xs font-mono font-bold text-rose-500">${state.prosocial}%</span>
                                    </div>
                                    <input type="range" value="${state.prosocial}" oninput="updatePro(this.value)" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-slate-800">
                                </section>
                            </div>
                        </div>

                        <div class="rounded-3xl p-8 border-2 border-slate-50 bg-slate-50 shadow-sm transition-all duration-500">
                            <div class="flex items-center gap-4 mb-6">
                                <div class="p-4 rounded-2xl shadow-xl ${data.color}">
                                    <i data-lucide="${data.icon}" class="text-white w-8 h-8"></i>
                                </div>
                                <div>
                                    <h3 class="text-2xl font-black text-slate-800 tracking-tight">${data.style}</h3>
                                    <p class="text-xs text-slate-400 mt-1 font-bold italic">${data.quote}</p>
                                </div>
                            </div>
                            <p class="text-sm text-slate-600 leading-relaxed font-medium mb-6">${data.description}</p>
                            <div class="pt-6 border-t border-slate-200 flex justify-center">
                                <button onclick="resetAssessment()" class="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2 hover:text-indigo-600 transition-colors">
                                    <i data-lucide="rotate-ccw" class="w-3 h-3"></i> 重新探索 (變更工號)
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col space-y-6">
                        <div class="relative aspect-square bg-white border-8 border-slate-50 rounded-[2.5rem] shadow-inner overflow-hidden">
                            <div class="absolute top-1/2 left-0 w-full h-px bg-slate-100 -translate-y-1/2"></div>
                            <div class="absolute top-0 left-1/2 w-px h-full bg-slate-100 -translate-x-1/2"></div>
                            
                            <div class="absolute top-6 left-1/2 -translate-x-1/2 text-[9px] font-black text-slate-300 uppercase tracking-widest text-center w-full">高度支持熱忱</div>
                            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-[9px] font-black text-slate-300 uppercase tracking-widest text-center w-full">低度支持熱忱</div>
                            <div class="absolute right-4 top-1/2 -translate-y-1/2 text-[9px] font-black text-slate-300 uppercase tracking-widest rotate-90 origin-right">高度引導推動</div>
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-[9px] font-black text-slate-300 uppercase tracking-widest -rotate-90 origin-left">低度引導推動</div>
                            
                            <div class="absolute transition-all duration-1000 ease-out flex items-center justify-center" 
                                style="left: ${state.internalLoc}%; bottom: ${state.prosocial}%; transform: translate(-50%, 50%)">
                                <div class="w-7 h-7 rounded-lg border-2 border-white shadow-xl ${data.color} flex items-center justify-center">
                                    <div class="w-1 h-1 bg-white rounded-full animate-ping"></div>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <div class="bg-amber-50/50 p-6 rounded-2xl border border-amber-100">
                                <h4 class="text-xs font-black text-amber-700 flex items-center gap-2 mb-3 uppercase tracking-wider underline decoration-amber-200 decoration-2 underline-offset-4">
                                    <i data-lucide="battery" class="w-4 h-4"></i> 能量管理與自我照顧建議
                                </h4>
                                <p class="text-xs text-slate-700 leading-relaxed font-medium">${data.energyAdvice}</p>
                            </div>
                            <div class="bg-sky-50/50 p-6 rounded-2xl border border-sky-100">
                                <h4 class="text-xs font-black text-sky-700 flex items-center gap-2 mb-3 uppercase tracking-wider underline decoration-sky-200 decoration-2 underline-offset-4">
                                    <i data-lucide="sparkles" class="w-4 h-4"></i> 導師成長的小小挑戰
                                </h4>
                                <p class="text-xs text-slate-700 leading-relaxed font-medium">${data.growthTip}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 互動控制器 ---

        window.setAnswer = (val, idx) => {
            if (state.currentStep === 1) state.locAnswers[idx] = val;
            else state.proAnswers[idx] = val;
            render();
        };

        window.nextStep = () => {
            if (state.currentStep < 2) {
                state.currentStep++;
                render();
            } else {
                state.internalLoc = Math.round((state.locAnswers.reduce((a,b)=>a+b, 0) / 25) * 100);
                state.prosocial = Math.round((state.proAnswers.reduce((a,b)=>a+b, 0) / 25) * 100);
                state.mode = 'result';
                state.isSubmitting = true;
                render();
                submitData().then(() => {
                    state.isSubmitting = false;
                    render();
                });
            }
        };

        window.prevStep = () => {
            if (state.currentStep > 0) {
                state.currentStep--;
                render();
            }
        };

        window.updateLoc = (v) => {
            state.internalLoc = parseInt(v);
            render();
        };

        window.updatePro = (v) => {
            state.prosocial = parseInt(v);
            render();
        };

        window.resetAssessment = () => {
            state.mode = 'assessment';
            state.currentStep = 0;
            state.locAnswers = [0, 0, 0, 0, 0];
            state.proAnswers = [0, 0, 0, 0, 0];
            render();
        };

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
